<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCF IJK Viewer</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f5f0;
        --fg: #1f201d;
        --panel: #fffffff0;
        --line: #d8dccd;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(1000px 640px at 15% 15%, #dde4d4 0%, var(--bg) 45%, #ecefe7 100%);
        color: var(--fg);
        font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #canvas-root {
        width: 100%;
        height: 100%;
      }
      #controls {
        position: absolute;
        top: 16px;
        left: 16px;
        min-width: 320px;
        max-width: min(520px, calc(100vw - 32px));
        padding: 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 14px 40px rgba(30, 35, 20, 0.16);
        backdrop-filter: blur(4px);
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 10px;
      }
      .row label {
        min-width: 110px;
        font-size: 13px;
      }
      input[type="range"] {
        width: 100%;
      }
      button,
      select {
        border-radius: 6px;
        border: 1px solid #bfc7b3;
        background: #fff;
        padding: 6px 8px;
        font: inherit;
      }
      #status,
      #bbox,
      #error {
        margin-top: 8px;
        font-size: 12px;
        white-space: pre-wrap;
      }
      #status {
        color: #2f3a2d;
      }
      #bbox {
        color: #34505d;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      #error {
        color: #9f2424;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvas-root"></div>
      <div id="controls">
        <div><strong>CCF IJK Point Cloud</strong></div>
        <div style="font-size: 12px; margin-top: 2px">Trackball: left-drag rotate, right-drag pan, wheel zoom</div>
        <div class="row">
          <label for="color-mode">Color</label>
          <select id="color-mode">
            <option value="r_um" selected>r_um</option>
            <option value="t_lookup">t_lookup</option>
            <option value="axis">axis</option>
            <option value="leiden" disabled>leiden</option>
          </select>
          <button id="reset-camera">Reset Camera</button>
        </div>
        <div class="row">
          <label for="point-size">Point Size</label>
          <input id="point-size" type="range" min="0.1" max="2.5" step="0.1" value="0.5" />
        </div>
        <div id="status"></div>
        <div id="bbox"></div>
        <div id="error"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
