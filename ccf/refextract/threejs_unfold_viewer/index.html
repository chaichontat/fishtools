<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AP/ML Unfold Viewer</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8f3;
        --fg: #1e1f1c;
        --panel: #ffffffee;
        --line: #d8dbc8;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(
          1200px 700px at 15% 20%,
          #dce3d0 0%,
          var(--bg) 45%,
          #ecefe0 100%
        );
        color: var(--fg);
        font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #canvas-root {
        width: 100%;
        height: 100%;
      }
      #controls {
        position: absolute;
        right: 16px;
        bottom: 16px;
        min-width: 330px;
        max-width: min(500px, calc(100vw - 32px));
        padding: 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 14px 40px rgba(28, 32, 20, 0.16);
        backdrop-filter: blur(5px);
      }
      #hemisphere-toggle {
        position: absolute;
        top: 16px;
        right: 16px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 14px 40px rgba(28, 32, 20, 0.16);
        backdrop-filter: blur(5px);
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 10px;
      }
      .row.controls-main {
        margin-top: 0;
      }
      .row.controls-main input[type="range"] {
        flex: 1 1 auto;
        min-width: 120px;
      }
      .row.controls-main input[type="number"] {
        width: 88px;
        flex: 0 0 auto;
      }
      .row.controls-main button,
      .row.controls-main select {
        flex: 0 0 auto;
      }
      .legend-note {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #33413a;
      }
      .legend-swatch {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        border: 1px solid rgba(36, 41, 34, 0.18);
        background: linear-gradient(135deg, #6b7580 0%, #4f5862 100%);
      }
      .row label {
        min-width: 100px;
        font-size: 13px;
      }
      input[type="range"] {
        width: 100%;
      }
      button,
      select,
      input[type="number"] {
        border-radius: 6px;
        border: 1px solid #bfc5aa;
        background: #fff;
        padding: 6px 8px;
        font: inherit;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
        color: #3e4437;
        min-height: 1.2em;
      }
      #camera-readout {
        margin-top: 6px;
        font-size: 12px;
        color: #2f4a60;
        white-space: pre;
        font-family:
          ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
      }
      #error {
        margin-top: 8px;
        color: #9f2424;
        font-size: 12px;
        white-space: pre-wrap;
      }
      #scalebar-wrap {
        position: absolute;
        left: 20px;
        bottom: 18px;
        padding: 0;
        user-select: none;
      }
      #scalebar {
        height: 4px;
        width: 120px;
        background: #1f1f1a;
        border-radius: 2px;
      }
      #scalebar-label {
        margin-top: 6px;
        font-size: 12px;
        color: #000000;
        text-align: center;
        font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvas-root"></div>
      <label id="hemisphere-toggle">
        <input id="both-hemispheres" type="checkbox" />
        Both hemispheres
      </label>
      <div id="controls">
        <div class="row controls-main">
          <button id="play">Play</button>
          <select id="speed">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
          </select>
          <input
            id="progress"
            type="range"
            min="0"
            max="1"
            step="0.001"
            value="0"
          />
          <input
            id="progress-number"
            type="number"
            min="0"
            max="1"
            step="0.001"
            value="0"
          />
        </div>
        <div class="legend-note">
          <span class="legend-swatch"></span>
          <span>Shaded region: neocortex</span>
        </div>
        <div class="row">
          <button id="snapshot">Snapshot PNG</button>
        </div>
        <div id="status" aria-live="polite"></div>
        <div id="camera-readout"></div>
        <div id="error"></div>
      </div>
      <div id="scalebar-wrap">
        <div id="scalebar"></div>
        <div id="scalebar-label"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
