<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AP/ML Unfold Viewer</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8f3;
        --fg: #1e1f1c;
        --panel: #ffffffee;
        --line: #d8dbc8;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(
          1200px 700px at 15% 20%,
          #dce3d0 0%,
          var(--bg) 45%,
          #ecefe0 100%
        );
        color: var(--fg);
        font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #canvas-root {
        width: 100%;
        height: 100%;
      }
      #controls {
        position: absolute;
        top: 16px;
        left: 16px;
        min-width: 330px;
        max-width: min(500px, calc(100vw - 32px));
        padding: 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 14px 40px rgba(28, 32, 20, 0.16);
        backdrop-filter: blur(5px);
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 10px;
      }
      .row label {
        min-width: 100px;
        font-size: 13px;
      }
      input[type="range"] {
        width: 100%;
      }
      button,
      select,
      input[type="number"] {
        border-radius: 6px;
        border: 1px solid #bfc5aa;
        background: #fff;
        padding: 6px 8px;
        font: inherit;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
        color: #3e4437;
      }
      #camera-readout {
        margin-top: 6px;
        font-size: 12px;
        color: #2f4a60;
        font-family:
          ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
      }
      #error {
        margin-top: 8px;
        color: #9f2424;
        font-size: 12px;
        white-space: pre-wrap;
      }
      #axis-legend {
        margin-top: 8px;
        padding: 8px 10px;
        border: 1px solid #d3d9c1;
        border-radius: 8px;
        background: #f7f9ef;
        font-size: 12px;
        line-height: 1.35;
      }
      #axis-legend b {
        font-weight: 600;
      }
      #scalebar-wrap {
        position: absolute;
        left: 20px;
        bottom: 18px;
        padding: 0;
        user-select: none;
      }
      #scalebar {
        height: 4px;
        width: 120px;
        background: #1f1f1a;
        border-radius: 2px;
      }
      #scalebar-label {
        margin-top: 6px;
        font-size: 12px;
        color: #000000;
        text-align: center;
        font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvas-root"></div>
      <div id="controls">
        <div><strong>AP/ML Unfold Viewer</strong></div>
        <div style="font-size: 12px; margin-top: 2px">
          Trackball: left-drag rotate, right-drag pan, wheel zoom
        </div>
        <div id="axis-legend">
          <div><b>Directions</b></div>
          <div>Anterior: -Z, Posterior: +Z</div>
          <div>Lateral: -X, Medial: +X</div>
        </div>
        <div class="row">
          <label for="progress">Progress</label>
          <input
            id="progress"
            type="range"
            min="0"
            max="1"
            step="0.001"
            value="0"
          />
        </div>
        <div class="row">
          <button id="play">Play</button>
          <button id="reset">Reset Camera</button>
          <label
            style="
              min-width: auto;
              display: flex;
              align-items: center;
              gap: 6px;
            "
          >
            <input id="flip" type="checkbox" />
            Flip xz
          </label>
          <select id="speed">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
          </select>
        </div>
        <div class="row">
          <label for="duration">Duration (s)</label>
          <input id="duration" type="number" min="1" step="1" value="8" />
        </div>
        <div id="status"></div>
        <div id="camera-readout"></div>
        <div id="error"></div>
      </div>
      <div id="scalebar-wrap">
        <div id="scalebar"></div>
        <div id="scalebar-label"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
